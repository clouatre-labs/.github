# Reusable security and lint jobs shared across the organization.
# Mirrors the lint-commits rollout pattern: callers pass a label when public
# (org-level self-hosted runners do not serve public repos) and keep their
# aggregate check named 'Security Result'; the effective check runs report as
# '<caller job name> / <inner job name>'.
name: Security & Lint

on:
  workflow_call:
    inputs:
      label:
        description: Runner label; public callers must pass a GitHub-hosted arm label
        required: false
        type: string
        default: oci-arm
      secret-scan:
        description: Run the TruffleHog verified-secret scan
        required: false
        type: boolean
        default: true
      zizmor:
        description: Run the zizmor workflow audit
        required: false
        type: boolean
        default: true
      reuse:
        description: Run the REUSE compliance check
        required: false
        type: boolean
        default: true
      markdown-lint:
        description: Run markdownlint-cli2
        required: false
        type: boolean
        default: true
      zizmor-min-severity:
        description: Minimum zizmor finding severity (low, medium, high)
        required: false
        type: string
        default: medium
      zizmor-config:
        description: Path to a zizmor config file; empty means default behavior without a config
        required: false
        type: string
        default: ""
      zizmor-advanced-security:
        description: Upload zizmor findings as SARIF code scanning results (public repos or GHAS license)
        required: false
        type: boolean
        default: false
      markdownlint-globs:
        description: Globs passed to markdownlint-cli2
        required: false
        type: string
        default: "**/*.md"
      markdown-lint-install:
        description: Optional shell command run before markdownlint (e.g. installing custom rule dependencies)
        required: false
        type: string
        default: ""
      markdown-extra-check:
        description: Optional additional markdown check command run after markdownlint (e.g. prettier prose check)
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ${{ inputs.label }}
    if: ${{ inputs.secret-scan }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # TruffleHog is used instead of gitleaks/gitleaks-action because gitleaks-action
      # requires a GITLEAKS_LICENSE org secret for GitHub Organisation repos (free tier
      # available but requires registration). TruffleHog has no per-org licensing gate.
      - name: Scan for committed secrets
        uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with:
          extra_args: --only-verified

  zizmor:
    name: Workflow SHA pinning
    runs-on: ${{ inputs.label }}
    if: ${{ inputs.zizmor && !inputs.zizmor-advanced-security }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint GitHub Actions workflows
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          min-severity: ${{ inputs.zizmor-min-severity }}
          advanced-security: false
          config: ${{ inputs.zizmor-config }}

  # Separate job so permissions stay literal; only callers that opt into
  # SARIF upload pay for security-events: write.
  zizmor-sarif:
    name: Workflow SHA pinning (SARIF)
    runs-on: ${{ inputs.label }}
    if: ${{ inputs.zizmor && inputs.zizmor-advanced-security }}
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # needed for SARIF upload
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint GitHub Actions workflows
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          min-severity: ${{ inputs.zizmor-min-severity }}
          advanced-security: true
          token: ${{ secrets.GITHUB_TOKEN }}
          config: ${{ inputs.zizmor-config }}

  reuse:
    name: REUSE Compliance
    runs-on: ${{ inputs.label }}
    if: ${{ inputs.reuse }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check REUSE compliance
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  markdown-lint:
    name: Lint markdown
    runs-on: ${{ inputs.label }}
    if: ${{ inputs.markdown-lint }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        if: inputs.markdown-lint-install != ''
        run: ${{ inputs.markdown-lint-install }}
      - name: Lint with markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: ${{ inputs.markdownlint-globs }}
      - name: Extra markdown checks
        if: inputs.markdown-extra-check != ''
        run: ${{ inputs.markdown-extra-check }}

  security-result:
    name: Security Result
    runs-on: ${{ inputs.label }}
    needs: [secrets, zizmor, zizmor-sarif, reuse, markdown-lint]
    if: always()
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check all security jobs passed
        run: |
          for result in "${{ needs.secrets.result }}" "${{ needs.zizmor.result }}" "${{ needs.zizmor-sarif.result }}" "${{ needs.reuse.result }}" "${{ needs.markdown-lint.result }}"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "Security check failed or cancelled: $result"
              exit 1
            fi
          done
          echo "All security checks passed"
