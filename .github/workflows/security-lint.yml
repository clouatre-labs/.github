# Reusable security and lint jobs shared across the organization (base
# Methodology: docs/golden-workflows.md
# variant; zizmor runs read-only). Repos that upload zizmor findings as
# SARIF code scanning results call security-lint-sarif.yml instead, so
# callers never need to grant security-events: write they do not use.
# Mirrors the lint-commits rollout pattern: callers pass a label when public
# (org-level self-hosted runners do not serve public repos) and keep their
# aggregate check named 'Security Result'; the effective check runs report as
# '<caller job name> / <inner job name>'.
name: Security & Lint

on:
  workflow_call:
    inputs:
      label:
        description: Runner label; public callers must pass a GitHub-hosted arm label
        required: false
        type: string
        default: oci-arm
      secret-scan:
        description: Run the TruffleHog verified-secret scan
        required: false
        type: boolean
        default: true
      zizmor:
        description: Run the zizmor workflow audit
        required: false
        type: boolean
        default: true
      reuse:
        description: Run the REUSE compliance check
        required: false
        type: boolean
        default: true
      markdown-lint:
        description: Run markdownlint-cli2
        required: false
        type: boolean
        default: true
      zizmor-min-severity:
        description: Minimum zizmor finding severity (low, medium, high)
        required: false
        type: string
        default: medium
      zizmor-config:
        description: Path to a zizmor config file; empty means default behavior without a config
        required: false
        type: string
        default: ""
      markdownlint-globs:
        description: Globs passed to markdownlint-cli2
        required: false
        type: string
        default: "**/*.md"
      markdown-lint-install:
        description: Optional shell command run before markdownlint (e.g. installing custom rule dependencies)
        required: false
        type: string
        default: ""
      markdown-extra-check:
        description: Optional additional markdown check command run after markdownlint (e.g. prettier prose check)
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ${{ inputs.label }}
    if: ${{ inputs.secret-scan }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # TruffleHog is used instead of gitleaks/gitleaks-action because gitleaks-action
      # requires a GITLEAKS_LICENSE org secret for GitHub Organisation repos (free tier
      # available but requires registration). TruffleHog has no per-org licensing gate.
      - name: Scan for committed secrets
        uses: trufflesecurity/trufflehog@3bd2b5887eb0efb8fa18bfd1d296032924e4ffdc # v3.99.9
        with:
          extra_args: --only-verified

  zizmor:
    name: Workflow SHA pinning
    runs-on: ${{ inputs.label }}
    if: ${{ inputs.zizmor }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint GitHub Actions workflows
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          min-severity: ${{ inputs.zizmor-min-severity }}
          advanced-security: false
          config: ${{ inputs.zizmor-config }}

  reuse:
    name: REUSE Compliance
    runs-on: ${{ inputs.label }}
    if: ${{ inputs.reuse }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check REUSE compliance
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  markdown-lint:
    name: Lint markdown
    runs-on: ${{ inputs.label }}
    if: ${{ inputs.markdown-lint }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint with markdownlint-cli2
        # before any caller-supplied install, so node_modules markdown files
        # pulled in by markdown-lint-install never leak into the lint globs
        # (matches the original inline job ordering)
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: ${{ inputs.markdownlint-globs }}
      # npx/node are not on the hosted arm runner image; callers using
      # markdown-lint-install or markdown-extra-check almost always need Node.
      - name: Set up Node.js
        if: inputs.markdown-lint-install != '' || inputs.markdown-extra-check != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - name: Install dependencies
        if: inputs.markdown-lint-install != ''
        env:
          MARKDOWN_LINT_INSTALL: ${{ inputs.markdown-lint-install }}
        run: $MARKDOWN_LINT_INSTALL
      - name: Extra markdown checks
        if: inputs.markdown-extra-check != ''
        env:
          MARKDOWN_EXTRA_CHECK: ${{ inputs.markdown-extra-check }}
        run: $MARKDOWN_EXTRA_CHECK

  runner-policy:
    name: Runner policy
    # Org runner-label policy: private repos run jobs on oci-arm (self-hosted);
    # public repos run on GitHub-hosted ubuntu-26.04-arm (self-hosted runners on
    # public repos are a security risk). Enforcement is layered: the
    # oci-arm-private runner group restricts which repos can use the self-hosted
    # runners at all, and this job fails any PR introducing a violating label.
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enforce org runner-label policy
        run: |
          set -euo pipefail
          # Retry transient GitHub API errors (5xx, network); give up after 3
          # attempts.
          gh_retry() {
            local attempt out
            for attempt in 1 2 3; do
              if out=$("$@" 2>gh_err.log); then
                printf '%s' "$out"
                return 0
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::GitHub API unreachable after 3 attempts:"
                cat gh_err.log
                exit 1
              fi
              sleep 30
            done
          }
          vis=$(gh_retry gh api "repos/${GITHUB_REPOSITORY}" --jq .visibility)
          echo "Repo visibility: $vis"
          if [ "$vis" = "PUBLIC" ]; then
            bad='oci-arm|self-hosted'
            why='public repos must not use self-hosted runners'
          else
            bad='ubuntu-|windows-|macos-'
            why='private repos must use the oci-arm self-hosted runner'
          fi
          # Literal labels only; expression-based labels are not statically
          # verifiable and are exempt.
          violations=$(grep -RnE 'runs-on:[[:space:]]*[^$]' .github/workflows --include='*.yml' --include='*.yaml' \
            | grep -Ev 'runs-on:[[:space:]]*\$\{\{' \
            | grep -E "runs-on:.*($bad)" || true)
          if [ -n "$violations" ]; then
            echo "::error::Runner policy violation ($why):"
            printf '%s\n' "$violations"
            exit 1
          fi
          echo "Runner policy OK"

  security-result:
    name: Security Result
    runs-on: ${{ inputs.label }}
    needs: [secrets, zizmor, reuse, markdown-lint, runner-policy]
    if: always()
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check all security jobs passed
        run: |
          for result in "${{ needs.secrets.result }}" "${{ needs.zizmor.result }}" "${{ needs.reuse.result }}" "${{ needs.markdown-lint.result }}"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "Security check failed or cancelled: $result"
              exit 1
            fi
          done
          echo "All security checks passed"
