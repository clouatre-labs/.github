name: tmp-get-client-id

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  get-client-id:
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Mint app JWT and fetch client ID
        env:
          PRIVATE_KEY: ${{ secrets.ORG_APP_PRIVATE_KEY }}
          APP_ID: ${{ vars.ORG_APP_ID }}
        run: |
          set -euo pipefail
          openssl rsa -in <(printf '%s\n' "$PRIVATE_KEY") -out /tmp/key.pem 2>/dev/null
          NOW=$(date +%s)
          HEADER=$(printf '{"alg":"RS256","typ":"JWT"}' | openssl base64 -A | tr '+/' '-_' | tr -d '=')
          PAYLOAD=$(printf '{"iat":%s,"exp":%s,"iss":%s}' "$((NOW - 60))" "$((NOW + 540))" "$APP_ID" | openssl base64 -A | tr '+/' '-_' | tr -d '=')
          SIGNATURE=$(printf '%s.%s' "$HEADER" "$PAYLOAD" | openssl dgst -sha256 -sign /tmp/key.pem -binary | openssl base64 -A | tr '+/' '-_' | tr -d '=')
          JWT="$HEADER.$PAYLOAD.$SIGNATURE"
          rm -f /tmp/key.pem
          curl -sS -H "Authorization: Bearer $JWT" -H "Accept: application/vnd.github+json" \
            https://api.github.com/app > /tmp/app.json
          jq '{app_id: .id, slug: .slug, client_id: .client_id, name: .name}' /tmp/app.json
