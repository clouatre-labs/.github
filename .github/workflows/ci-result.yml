name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-result
  cancel-in-progress: false

jobs:
  ci-result:
    name: CI Result
    runs-on: ubuntu-26.04-arm
    if: always()
    permissions: {}
    steps:
      - name: All checks passed
        run: echo "CI Result passed."
